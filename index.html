layout: null
---

<!doctype html>
<html lang="en">
  <head>
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/assets/css/login.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Three.js canvas injected by login.js as #bg-canvas -->

    <div id="login-screen">
      <div id="logo-container">
        <div id="title-world-of">WORLD OF</div>
        <div id="title-warcraft">STRANDBERG</div>
        <div id="title-classic-wrap">
          <div id="title-classic">CLASSIC</div>
        </div>
      </div>

      <div id="login-card">
        <div class="realm-banner">
          <span class="realm-icon">&#x2694;</span>
          <span>Realm: Solna Campus</span>
          <span class="realm-icon">&#x2694;</span>
        </div>

        <button id="play-btn">PLAY NOW</button>

        <div id="loading-bar-container">
          <div id="loading-bar-track">
            <div id="loading-bar-fill"></div>
          </div>
          <span id="loading-text">Connecting to realm&hellip;</span>
        </div>

        <div class="login-footer">
          <a href="/resume/">&#x269C; About Aron</a>
        </div>
      </div>
    </div>
    <!-- #login-screen -->

    <div id="version-text">
      <a href="https://github.com/astrberg/strandberg.dev/commits/main" target="_blank" rel="noopener noreferrer" id="version-link"></a>
    </div>
    <div id="fade-overlay"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="/assets/js/login.js"></script>
  </body>
</html>
